<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <img class="charity-water-logo" src="img/cw_logo-horizontal.png" alt="charity: water">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn" type="button">Start Game</button>
            <button id="reset-btn" type="button">Reset</button>
        </div>
        <p id="game-message" class="game-message" role="status" aria-live="polite" hidden></p>
        <div id="game-container" aria-label="Water drop game area"></div>
    </div>
    <div id="confetti-container" aria-hidden="true"></div>
    
    <script src="script.js"></script>
</body>
</html>
